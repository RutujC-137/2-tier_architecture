version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Backend and Frontend dependencies..."
      - cd backend && npm install
      - cd ../frontend && npm install
  build:
    commands:
      - echo "Building Frontend Production Assets..."
      - cd ../frontend && npm run build
  post_build:
    commands:
      - echo "Triggering Deployment on EC2 via SSM..."
      # REPLACE YOUR_INSTANCE_ID with your actual ID (e.g., i-07e0c4...)
      - INSTANCE_ID="i-06a633561279ca141"
      - aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --parameters 'commands=["bash /var/www/my-app/scripts/deploy-all.sh"]'